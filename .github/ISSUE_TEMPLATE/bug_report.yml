name: 🐞 Bug report
description: The controller is not detected, does not vibrate, or behaves strangely.
labels: [bug]
body:
  - type: input
    id: controller
    attributes:
      label: Controller
      description: Exact model, e.g. "DualSense Edge", "8BitDo Ultimate 2.4G".
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [USB, Bluetooth, 2.4 GHz dongle, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: e.g. "Chrome 140 on Windows 11".
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Status shown by the page
      description: The status line and the badge at the top right (e.g. "WEBHID SONY", "DÉTECTÉ").
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Console errors (F12) help a lot.
    validations:
      required: true
